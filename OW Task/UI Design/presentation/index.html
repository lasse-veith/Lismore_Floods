<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lismore 2022, Flood Cost Model</title>
<link rel="stylesheet" href="dashboard-theme.css">
<style>
  /* ===========================================================
     APP SHELL — a left icon-rail sidebar (collapsed by default,
     expands sideways as an overlay on hover to reveal labels)
     plus a header + content area. This file only lays out
     structure and navigation; every page's real content lives in
     its own file under pages/ and is loaded here via <iframe>.
     =========================================================== */

  html, body { height: 100%; overflow: hidden; }

  .shell { display: flex; height: 100vh; }

  /* --- sidebar --- */
  .sidebar {
    position: fixed;
    left: 0; top: 0; bottom: 0;
    width: var(--sidebar-w-collapsed);
    background: var(--sidebar-bg);
    display: flex;
    flex-direction: column;
    align-items: stretch;
    padding: 20px 0 16px;
    z-index: 100;
    overflow: hidden;
    transition: width 0.28s var(--ease), box-shadow 0.28s var(--ease);
  }
  .sidebar:hover {
    width: var(--sidebar-w-expanded);
    box-shadow: 12px 0 40px rgba(0,0,0,0.18);
  }

  .sidebar-brand {
    display: flex;
    align-items: center;
    gap: 12px;
    height: 40px;
    padding: 0 26px;
    flex-shrink: 0;
  }
  .sidebar-brand .brand-mark {
    width: 32px; height: 32px;
    border-radius: 10px;
    background: #ffffff;
    color: var(--sidebar-bg);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .sidebar-brand .brand-mark svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; }
  .sidebar-brand .brand-name {
    color: #ffffff;
    font-weight: 600;
    font-size: 14.5px;
    letter-spacing: -0.01em;
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.2s var(--ease);
  }
  .sidebar:hover .sidebar-brand .brand-name { opacity: 1; transition-delay: 0.08s; }

  .sidebar-nav {
    margin-top: 28px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    flex: 1;
    padding: 0 14px;
  }

  .nav-item {
    position: relative;
    display: flex;
    align-items: center;
    gap: 14px;
    height: 46px;
    border-radius: var(--radius-sm);
    padding: 0 15px;
    background: transparent;
    border: none;
    cursor: pointer;
    color: var(--sidebar-text);
    width: 100%;
    text-align: left;
    transition: color 0.2s var(--ease), background 0.2s var(--ease);
  }
  .nav-item:hover { color: var(--sidebar-text-hover); background: rgba(255,255,255,0.06); }
  .nav-item.active { color: var(--sidebar-active-text); background: var(--sidebar-active-bg); }

  .nav-item .nav-icon { flex-shrink: 0; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; }
  .nav-item .nav-icon svg { width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 1.6; }

  .nav-item .nav-label {
    font-size: 13.5px;
    font-weight: 500;
    white-space: nowrap;
    opacity: 0;
    transform: translateX(-4px);
    transition: opacity 0.18s var(--ease), transform 0.18s var(--ease);
  }
  .sidebar:hover .nav-item .nav-label { opacity: 1; transform: translateX(0); transition-delay: 0.06s; }

  /* collapsed-state tooltip (only needed while collapsed — hidden once expanded) */
  .nav-item .nav-tip {
    position: absolute;
    left: calc(100% + 14px);
    top: 50%;
    transform: translateY(-50%);
    white-space: nowrap;
    background: var(--text-primary);
    color: #fff;
    border-radius: var(--radius-sm);
    padding: 6px 10px;
    font-size: 12px;
    font-weight: 500;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.12s var(--ease);
    z-index: 10;
  }
  .sidebar:not(:hover) .nav-item:hover .nav-tip { opacity: 1; }

  /* --- main area --- */
  .main-area {
    flex: 1;
    height: 100vh;
    margin-left: var(--sidebar-w-collapsed);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .topbar {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    padding: 26px 36px 18px;
    background: var(--bg);
  }

  .topbar-left { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .topbar-title { font-size: 30px; font-weight: 600; letter-spacing: -0.015em; color: var(--text-primary); }
  .topbar-meta {
    font-family: var(--font-mono); font-size: 11.5px; letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--text-tertiary);
  }

  .topbar-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }

  .topbar-tag {
    display: flex; align-items: center; gap: 7px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 8px 14px;
    font-size: 12.5px;
    color: var(--text-secondary);
    box-shadow: var(--shadow-card);
  }
  .topbar-tag .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--credibility); }

  /* --- content: one iframe per page, swapped on nav click --- */
  .content { flex: 1; min-height: 0; }
  .page-frame { width: 100%; height: 100%; border: none; display: block; }
</style>
</head>
<body>

<div class="shell">

  <!-- =========================================================
       SIDEBAR — collapsed to icons by default; hovering anywhere
       over it expands the whole rail sideways to reveal labels.
       ========================================================= -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24"><path d="M2 17c2 0 2-3 4-3s2 3 4 3 2-3 4-3 2 3 4 3 2-3 4-3"/><path d="M2 12c2 0 2-3 4-3s2 3 4 3 2-3 4-3 2 3 4 3 2-3 4-3" opacity="0.45"/></svg>
      </div>
      <span class="brand-name">Lismore FC</span>
    </div>

    <nav class="sidebar-nav" id="sidebarNav"></nav>
  </aside>

  <!-- =========================================================
       MAIN AREA — header + content. Content is one <iframe>
       whose src is swapped to the selected page's own file under
       pages/ — nothing about any page's content lives here.
       ========================================================= -->
  <div class="main-area">
    <header class="topbar">
      <div class="topbar-left">
        <div class="topbar-title" id="pageTitle">Overview</div>
        <div class="topbar-meta">Lismore 2022 Flood, Cost Model</div>
      </div>
      <div class="topbar-right">
        <div class="topbar-tag"><span class="dot"></span> Live data pipeline</div>
      </div>
    </header>

    <main class="content">
      <iframe class="page-frame" id="pageFrame" title="Page content"></iframe>
    </main>
  </div>

</div>

<script>
/* ===========================================================
   PAGE REGISTRY — the single source of truth for the sidebar
   and the content iframe. Add a page here + a file in pages/
   and it appears everywhere automatically.
   =========================================================== */
const ICONS = {
  overview: `<rect x="3" y="3" width="7" height="7" rx="0.5"/><rect x="14" y="3" width="7" height="7" rx="0.5"/><rect x="3" y="14" width="7" height="7" rx="0.5"/><rect x="14" y="14" width="7" height="7" rx="0.5"/>`,
  flood: `<path d="M2 17c2 0 2-3 4-3s2 3 4 3 2-3 4-3 2 3 4 3 2-3 4-3"/><path d="M2 12c2 0 2-3 4-3s2 3 4 3 2-3 4-3 2 3 4 3 2-3 4-3" opacity="0.45"/>`,
  staticModel: `<path d="M12 3 3 8l9 5 9-5-9-5Z"/><path d="M3 12l9 5 9-5" opacity="0.55"/><path d="M3 16l9 5 9-5" opacity="0.3"/>`,
  scale: `<path d="M12 3v17"/><path d="M5 21h14"/><path d="M12 6 5 9l3.5 6h-7L5 9"/><path d="M12 6l7 3-3.5 6h7L19 9"/>`,
  credibility: `<circle cx="12" cy="12" r="2.1"/><circle cx="4.5" cy="7" r="1.3" opacity="0.6"/><circle cx="19.5" cy="6.5" r="1" opacity="0.4"/><circle cx="20" cy="17" r="1.5" opacity="0.7"/><circle cx="4" cy="17.5" r="1" opacity="0.4"/><path d="M12 12 4.5 7M12 12l7.5-5.5M12 12 20 17M12 12 4 17.5" stroke-width="1"/>`,
};

const PAGES = [
  { id: 'overview',    label: 'Overview',         icon: ICONS.overview,    file: 'overview.html' },
  { id: 'flood',       label: 'Flooding Data',     icon: ICONS.flood,       file: 'flood.html' },
  { id: 'staticModel', label: 'Static Model',      icon: ICONS.staticModel, file: 'static-model.html' },
  { id: 'compare',     label: 'Static vs Repair',  icon: ICONS.scale,       file: 'compare.html' },
  { id: 'credibility', label: 'Credibility Model', icon: ICONS.credibility, file: 'credibility.html' },
];

const nav = document.getElementById('sidebarNav');
const pageTitle = document.getElementById('pageTitle');
const pageFrame = document.getElementById('pageFrame');

PAGES.forEach((p, i) => {
  const btn = document.createElement('button');
  btn.className = 'nav-item' + (i === 0 ? ' active' : '');
  btn.id = 'nav-' + p.id;
  btn.innerHTML = `<span class="nav-icon"><svg viewBox="0 0 24 24">${p.icon}</svg></span><span class="nav-label">${p.label}</span><span class="nav-tip">${p.label}</span>`;
  btn.addEventListener('click', () => selectPage(p.id));
  nav.appendChild(btn);
});

function selectPage(id) {
  const page = PAGES.find(p => p.id === id);
  document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
  document.getElementById('nav-' + id).classList.add('active');
  pageTitle.textContent = page.label;
  pageFrame.src = page.file;
}

selectPage(PAGES[0].id);
</script>
</body>
</html>
